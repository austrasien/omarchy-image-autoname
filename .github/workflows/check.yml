name: check

on:
  push:
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Syntax
        run: bash -n lib/*.sh install.sh uninstall.sh tests/helpers.sh
      - name: Helpers
        run: bash tests/helpers.sh
